name: timeline

services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-timeline}
      POSTGRES_USER:     ${POSTGRES_USER:-timeline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-timeline}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-timeline} -d ${POSTGRES_DB:-timeline}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Symfony (PHP-FPM) ──────────────────────────────────────────────────
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html:cached
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["sh", "-c", "mkdir -p /var/www/html/var/cache /var/www/html/var/tmp /var/www/html/var/log && chown -R www-data:www-data /var/www/html/var && exec php-fpm"]
    environment:
      APP_ENV:      dev
      APP_SECRET:   ${APP_SECRET:-changethis_min32chars_xxxxxxxxxxx}
      DATABASE_URL: "postgresql://${POSTGRES_USER:-timeline}:${POSTGRES_PASSWORD:-timeline}@db:5432/${POSTGRES_DB:-timeline}?serverVersion=16&charset=utf8"

  # ── Nginx (serves Symfony public/) ────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html:cached,ro
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - default
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.timeline-api.rule=Host(`api.timeline.michondr.space`)"
      - "traefik.http.routers.timeline-api.entrypoints=websecure"
      - "traefik.http.routers.timeline-api.tls.certresolver=myvercelresolver"
      - "traefik.http.services.timeline-api.loadbalancer.server.port=80"

  # ── React / Vite dev server ────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    restart: unless-stopped
    volumes:
      - ./frontend:/app:cached
      - fe_modules:/app/node_modules
    environment:
      VITE_API_URL: "https://api.timeline.michondr.space"
    networks:
      - default
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.timeline-fe.rule=Host(`timeline.michondr.space`)"
      - "traefik.http.routers.timeline-fe.entrypoints=websecure"
      - "traefik.http.routers.timeline-fe.tls.certresolver=myvercelresolver"
      - "traefik.http.services.timeline-fe.loadbalancer.server.port=5173"

  # ── Symfony Messenger worker ───────────────────────────────────────────
  messenger:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    command: ["php", "bin/console", "messenger:consume", "async", "--time-limit=3600", "-vv"]
    volumes:
      - ./backend:/var/www/html:cached
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV:      dev
      DATABASE_URL: "postgresql://${POSTGRES_USER:-timeline}:${POSTGRES_PASSWORD:-timeline}@db:5432/${POSTGRES_DB:-timeline}?serverVersion=16&charset=utf8"

volumes:
  db_data:
  fe_modules:

networks:
  proxy:
    external: true
