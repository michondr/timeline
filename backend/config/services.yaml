parameters:
    webauthn_rp_id:   '%env(WEBAUTHN_RP_ID)%'
    webauthn_rp_name: '%env(WEBAUTHN_RP_NAME)%'
    export_dir:       '%kernel.project_dir%/var/exports'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
            - '../src/Migrations/'

    App\Service\EncryptionService:
        arguments:
            $appSecret: '%env(APP_SECRET)%'

    App\Service\ExportService:
        arguments:
            $exportDir: '%export_dir%'

    App\Controller\ExportController:
        arguments:
            $exportDir: '%export_dir%'

    App\Controller\AuthController:
        arguments:
            $rpId:   '%webauthn_rp_id%'
            $rpName: '%webauthn_rp_name%'
